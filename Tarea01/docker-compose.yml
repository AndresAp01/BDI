services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bdi_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Bd2026Segura!
      - MSSQL_PID=Developer
    ports:
      - "14330:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "Bd2026Segura!" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  sqlserver_data: